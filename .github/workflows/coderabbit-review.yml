name: Request CodeRabbit Review

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  pull-requests: write

concurrency:
  group: coderabbit-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  request-review:
    name: Request review
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      # This workflow intentionally does not check out or execute pull request code.
      - name: Ask CodeRabbit to review the pull request
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: '@coderabbitai review'
            });
